name: Scheduled Cambridge registration

on:
  schedule:
    # Every 3 hours, so each run handles a small batch (less memory
    # pressure and latency on Render than two big daily batches).
    # GitHub Actions cron is UTC: 00, 03, ..., 21 UTC = 02, 05, ..., 23
    # Europe/Paris in summer (CEST), one hour earlier in winter (CET).
    # GitHub may start scheduled runs a few minutes late.
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # allows a manual "Run workflow" trigger too

# Never run two batches at once (e.g. a slow run overlapping a manual one):
# a second run waits for the first instead of racing it on Cambridge.
concurrency:
  group: cambridge-register
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cambridge registration
        run: |
          curl -sS -X POST "https://cambridge-rpa.onrender.com/register" \
            --max-time 1800 \
            -w "\nHTTP status: %{http_code}\n"
